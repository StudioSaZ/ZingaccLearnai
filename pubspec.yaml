  payhere_mobilesdk_flutter: ^3.0.2
  speech_to_text: ^7.5.0
  share_plus: ^12.0.2
  flutter_tts: ^4.2.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
