publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  file_picker: ^11.0.3
  http: ^1.2.2

  firebase_core: 4.7.0
  firebase_ai: 3.11.0
  firebase_app_check: ^0.4.1+2

  pdf: ^3.11.3
  printing: ^5.13.0
